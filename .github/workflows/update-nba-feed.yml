name: Update NBA confidence feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba_feed.py'
      - 'nba_predictor.py'
      - 'nba_model_v1.json'
      - 'test_nba_feed.py'
      - 'test_nba_predictor.py'
      - 'nba_v2_shadow.py'
      - 'nba_model_v2_challenger.json'
      - 'test_nba_v2_shadow.py'
      - 'nba_live_test.py'
      - 'test_nba_live_test.py'
      - '.github/workflows/update-nba-feed.yml'
  schedule:
    # Six times daily, UTC. Limits optional odds API usage to roughly 180 calls/month.
    - cron: '23 1,5,9,13,17,21 * * *'

# Share deployment / git-push queue with the existing CBB update workflow.
concurrency:
  group: cbb-tier-a-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  nba-feed-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout existing basketball dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate NBA scanner and grading
        run: |
          python -m py_compile nba_feed.py nba_predictor.py nba_v2_shadow.py nba_live_test.py test_nba_feed.py test_nba_predictor.py test_nba_v2_shadow.py test_nba_live_test.py
          python -m unittest -q test_nba_feed.py test_nba_predictor.py test_nba_v2_shadow.py test_nba_live_test.py
          python - <<'PY'
          from nba_predictor import read_model
          spec = read_model()
          assert spec["model_id"] == "nba-elo-logistic-v1-2026-10-25"
          assert spec["market_edge_validated"] is False
          assert spec["evaluation"]["untouched_holdout"]["nba_model"]["brier"] > spec["evaluation"]["untouched_holdout"]["historical_market_novig"]["brier"]
          from pathlib import Path
          import json
          v2 = json.loads(Path("nba_model_v2_challenger.json").read_text())
          assert v2["status"].startswith("EXPERIMENTAL SHADOW")
          assert v2["promotion_allowed"] is False
          assert v2["v2_beats_market_holdout_brier"] is False
          assert v2["metrics"]["holdout"]["v2"]["brier"] < v2["metrics"]["holdout"]["v1"]["brier"]
          print("NBA independent holdout / v2 shadow-only integrity OK")
          PY

      - name: Check combined dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('site/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          assert scripts, 'No dashboard scripts found'
          assert 'nbaRenderSchedule' in html
          assert 'totals-v3-kpis' in html
          Path('/tmp/basketball-dashboard-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/basketball-dashboard-inline.js

      - name: Refresh NBA schedule and optional moneylines
        env:
          NBA_ODDS_API_KEY: ${{ secrets.NBA_ODDS_API_KEY }}
          NBA_ODDS_BOOKMAKER: draftkings
        run: python nba_feed.py

      - name: Commit feed data without modifying CBB results
        run: |
          git config user.name "basketball-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/nba_plays.json site/data/nba_live_test.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NBA schedule, forecasts, and prospective paper-trial ledger"
            # Repository edits may land after checkout; integrate them rather
            # than force-pushing or overwriting CBB research state.
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              # Prefer remote feed/ledger data when concurrent writers touch
              # the same snapshots. Keep already-published first-seen forecasts.
              git rebase -X ours origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Remote moved during attempt ${attempt}; retrying safely."
              sleep 2
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Unable to push NBA feed without a conflict." >&2
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload unified basketball dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy same dashboard
        uses: actions/deploy-pages@v4
        id: deployment
