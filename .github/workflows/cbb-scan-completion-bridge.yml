name: CBB Scan Completion Bridge

# Listens for the scanner's completed Actions runs and posts an event to PR #4.
# The scanner and model rules are not modified.
on:
  workflow_run:
    workflows: ["Update CBB Tier A dashboard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cbb-scan-completion-bridge
  cancel-in-progress: false

jobs:
  publish-completion:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish completion to PR #4
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = 4;  // Dedicated draft PR used as a ChatGPT Work event feed.
            const manual = context.eventName === 'workflow_dispatch';
            const run = manual ? null : context.payload.workflow_run;
            const result = manual ? 'BRIDGE_TEST_ONLY' : String(run?.conclusion ?? 'unknown').toUpperCase();
            let state = null;
            let readError = '';
            try {
              const response = await github.rest.repos.getContent({
                owner, repo, path: 'site/data/state.json', ref: 'main'
              });
              if (!response.data.content) throw new Error('state.json has no content');
              state = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            } catch (err) {
              readError = String(err.message || err).slice(0, 180);
            }
            const updated = state?.last_updated_pt || 'unavailable';
            const startMs = Date.parse(run?.run_started_at || run?.created_at || '');
            const endMs = Date.parse(run?.updated_at || '');
            const dataMs = Date.parse(updated);
            const dataMatchesRun = !manual && result === 'SUCCESS' &&
              Number.isFinite(startMs) && Number.isFinite(endMs) && Number.isFinite(dataMs) &&
              dataMs >= startMs - 3 * 60000 && dataMs <= endMs + 5 * 60000 &&
              state?.status === 'OK';
            const status = manual ? 'TEST_ONLY_NOT_A_SCAN' :
              dataMatchesRun ? 'FRESH_COMMITTED_STATE' : 'STALE_OR_UNVERIFIED';
            const runUrl = manual
              ? `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
              : run?.html_url || 'unavailable';
            const lines = [
              '## CBB_SCAN_COMPLETED',
              `**Result:** ${result}`,
              `**Data check:** ${status}`,
              '**Workflow:** Update CBB Tier A dashboard',
              `**Source trigger:** ${manual ? 'manual bridge test' : (run?.event || 'unknown')}`,
              `**Source Actions run:** ${runUrl}`,
              `**Source run number:** ${manual ? 'none; bridge-only test' : (run?.run_number ?? 'unknown')}`,
              `**Source branch:** ${manual ? 'n/a' : (run?.head_branch || 'unknown')}`,
              `**Committed state updated (PT):** ${updated}`,
              `**State status:** ${state?.status || 'unavailable'}`,
              `**Latest recorded scan date:** ${state?.runs?.at(-1)?.date || 'unavailable'}`,
              readError ? `**Read error:** ${readError}` : '',
              '',
              '### ChatGPT Work task instruction',
              'Treat this comment as a scan completion signal, not a betting recommendation.',
              'For BRIDGE_TEST_ONLY, report bridge test success only; do not report bets.',
              'Otherwise fetch latest committed site/data/state.json independently and validate',
              'scan success, freshness, ATS v4 / Totals v1 thresholds, KenPom location, QC,',
              'sportsbook line snapshots and age, and game start times. Never publish stale',
              'or already-started plays; report failure or PASS when appropriate. Only',
              'notify of fresh or materially changed plays. No auto-bets.',
              '',
              `<!-- cbb-scan-completion-bridge ${manual ? context.runId : run?.id} -->`
            ].filter(Boolean);
            await github.rest.issues.createComment({
              owner, repo, issue_number, body: lines.join('\n')
            });
            core.info(`Posted ${result} to PR #${issue_number}; data status ${status}`);
