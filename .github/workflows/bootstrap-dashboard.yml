name: Bootstrap CBB Tier A dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct and verify dashboard package
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part1.b64 payload/part1b.b64 payload/part2.b64 payload/part3.b64 payload/part4.b64 payload/part5.b64 | base64 --decode > /tmp/dashboard.tar.xz
          echo "70362a43653a27b8979348cb012c68654e9ea072a646a7065ab008d47ac9422e  /tmp/dashboard.tar.xz" | sha256sum --check
          mkdir -p /tmp/cbb-bootstrap
          tar -xJf /tmp/dashboard.tar.xz -C /tmp/cbb-bootstrap
          cp -a /tmp/cbb-bootstrap/CBB_TierA_Auto_Dashboard/. .
          cp README_SETUP.md README.md
          rm -rf payload
          rm -f .github/workflows/bootstrap-dashboard.yml

      - name: Commit automated dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cbb-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap automated CBB Tier A dashboard"
          git push
