name: Update CBB Tier A dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cbb_tierA_scanner.py'
      - 'dashboard_sync.py'
      - 'cbb_totals_model_v1.b64'
      - 'cbb_totals_model_v1_spec.json'
      - 'cbb_totals_model_v2_challenger.json'
      - 'cbb_totals_model_v3_challenger.json'
      - 'site/**'
      - '.github/workflows/update-dashboard.yml'
      - '.github/scripts/cbb-scan-signal.cjs'
      - '.github/scripts/wait-pages-artifact.cjs'
      - '.github/scripts/test-cbb-publishing.cjs'
  schedule:
    - cron: '15 7 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '30 10,12 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '0 14 * * *'
      timezone: 'America/Los_Angeles'
    # 2026-27 opening-week exception: the season begins with unusually early/overnight games.
    - cron: '17 5 1 11 *'
      timezone: 'America/Los_Angeles'
    - cron: '17 20,23 1 11 *'
      timezone: 'America/Los_Angeles'
    - cron: '17 2,5 2 11 *'
      timezone: 'America/Los_Angeles'

concurrency:
  group: cbb-tier-a-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: read
  pull-requests: write

jobs:
  update-and-deploy:
    name: Scan and save CBB results
    runs-on: ubuntu-24.04
    outputs:
      skipped: ${{ steps.scanner.outputs.skipped }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A rerun must use current main, not the SHA from the original failed attempt.
          ref: main

      - name: Verify publishing and scan-status handling
        run: node --test .github/scripts/test-cbb-publishing.cjs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Preflight model and code integrity
        run: |
          python -m py_compile cbb_tierA_scanner.py dashboard_sync.py test_cbb_venue_qc.py test_dashboard_venue_qc.py test_cbb_line_shopping_watchlist.py
          python -m unittest -v test_cbb_venue_qc test_dashboard_venue_qc test_cbb_line_shopping_watchlist
          python - <<'PY'
          import base64, io, json, joblib
          from pathlib import Path
          raw = base64.b64decode(Path("cbb_totals_model_v1.b64").read_text().strip(), validate=True)
          model = joblib.load(io.BytesIO(raw))
          spec = json.loads(Path("cbb_totals_model_v1_spec.json").read_text())
          assert len(spec["features"]) == 78
          assert hasattr(model, "predict")
          v2 = json.loads(Path("cbb_totals_model_v2_challenger.json").read_text())
          assert v2["status"] == "shadow-only prospective challenger"
          assert len(v2["features"]) == 78
          for key in ["imputer_statistics", "scaler_mean", "scaler_scale", "feature_multipliers", "ridge_coef"]:
              assert len(v2[key]) == 78
          assert float(v2["ridge_alpha"]) == 30000
          print("Totals v1 preflight OK:", len(raw), "bytes,", len(spec["features"]), "features")
          print("Totals v2 shadow preflight OK:", len(v2["features"]), "features, alpha", v2["ridge_alpha"])
          v3 = json.loads(Path("cbb_totals_model_v3_challenger.json").read_text())
          assert v3["status"].startswith("experimental shadow-only challenger")
          assert len(v3["features"]) == 78
          for key in ["imputer_statistics", "scaler_mean", "scaler_scale", "feature_multipliers", "ridge_coef"]:
              assert len(v3[key]) == 78
          assert float(v3["ridge_alpha"]) == 30000
          assert v3["priority_order"] == ["3PA rate", "FT%", "turnover rate", "tempo"]
          fam = v3["family_effective_abs_coefficient_sum"]
          assert fam["3PA_rate"] > fam["FT_pct"] > fam["turnover_rate"] > fam["tempo"]
          print("Totals v3 experimental shadow preflight OK:", len(v3["features"]), "features, alpha", v3["ridge_alpha"], "priority", v3["priority_order"])
          PY

      - name: Restore CBBD team-history cache
        uses: actions/cache@v6
        with:
          path: cache
          key: cbb-history-${{ github.run_number }}
          restore-keys: |
            cbb-history-

      - name: Resolve Pacific date
        id: date
        run: |
          pacific_date="$(TZ=America/Los_Angeles date +%F)"
          pacific_hour="$(TZ=America/Los_Angeles date +%H)"
          target="$pacific_date"
          # On Sunday Nov. 1, the U.S. opening marathon starts late Pacific time
          # but is officially part of the Nov. 2 slate. Pre-scan that slate.
          if [ "$pacific_date" = "2026-11-01" ] && [ "$pacific_hour" -ge 20 ]; then
            target="2026-11-02"
          fi
          echo "today=$target" >> "$GITHUB_OUTPUT"

      - name: Run frozen Tier A scanner
        id: scanner
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python cbb_tierA_scanner.py --date "${{ steps.date.outputs.today }}" 2>&1 | tee scanner.log
          if grep -q '^SCAN_STATUS=SKIPPED_KENPOM_ARCHIVE$' scanner.log; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::KenPom same-day archive is not available yet. This scan was cleanly skipped; dashboard state was not changed."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync persistent dashboard state and settle games
        id: sync
        if: steps.scanner.outputs.skipped != 'true'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python dashboard_sync.py "${{ steps.date.outputs.today }}"

      - name: Commit persistent dashboard state
        id: commit
        if: steps.scanner.outputs.skipped != 'true'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CBB_TARGET_DATE: ${{ steps.date.outputs.today }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cbb-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Concurrent CBB/NBA commits and retries can advance main mid-scan.
          # Never rebase two independently generated JSON ledgers: overlapping
          # snapshots conflict, and blindly resolving them could lose entries.
          # Instead regenerate from the latest committed state using the
          # SAME frozen scanner output (no extra KenPom/lines scan).
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Remote advanced; replaying this scan onto the latest committed dashboard state (attempt ${attempt})."
              # Files in output/ are generated untracked scanner artifacts.
              test -f "output/all_scored_${CBB_TARGET_DATE}.csv" || {
                echo "Scanner output missing; refusing to rebuild ledger." >&2
                exit 1
              }
              git reset --hard origin/main
              python dashboard_sync.py "$CBB_TARGET_DATE"
            fi
            git add data/state.json site/data/state.json neutral_overrides.csv
            if git diff --cached --quiet; then
              echo "Dashboard state already current; nothing to commit."
              pushed=1
              break
            fi
            git commit -m "Update CBB Tier A dashboard state"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Remote moved during push; next attempt will safely rebuild from main."
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "Unable to publish state after four safe attempts; refusing to overwrite remote data." >&2
            exit 1
          fi

      # Signal scan status before publishing; publishing cannot invalidate saved results.
      - name: Publish scan-completion signal for ChatGPT Work
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CBB_JOB_STATUS: ${{ job.status }}
          CBB_SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          CBB_SYNC_OUTCOME: ${{ steps.sync.outcome }}
          CBB_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          CBB_SKIPPED: ${{ steps.scanner.outputs.skipped }}
          CBB_TARGET_DATE: ${{ steps.date.outputs.today }}
        with:
          script: |
            const signal = require('./.github/scripts/cbb-scan-signal.cjs');
            await signal({ github, context, core });

      - name: Save derived pre-tip research to private repository
        if: github.ref == 'refs/heads/main' && steps.scanner.outcome == 'success' && steps.scanner.outputs.skipped != 'true' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          CBB_RESEARCH_TOKEN: ${{ secrets.CBB_RESEARCH_TOKEN }}
          CBB_TARGET_DATE: ${{ steps.date.outputs.today }}
        run: python cbb_private_export.py

  deploy:
    name: Publish saved dashboard (safe to retry alone)
    needs: update-and-deploy
    if: needs.update-and-deploy.outputs.skipped != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outputs.page_url || steps.deploy_second.outputs.page_url || steps.deploy_final.outputs.page_url }}
    steps:
      # A deployment-only rerun publishes current committed data, never rescans
      # or rolls the live site back to the original run's older snapshot.
      - name: Checkout current saved dashboard
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # Reruns cannot leave two identically named artifacts in one run.
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for uploaded artifact to be visible
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const wait = require('./.github/scripts/wait-pages-artifact.cjs');
            await wait({ github, context, core });

      - name: Deploy dashboard
        id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before second publishing attempt
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15

      - name: Retry dashboard publishing
        id: deploy_second
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before final publishing attempt
        if: steps.deploy_second.outcome == 'failure'
        run: sleep 30

      - name: Final dashboard publishing attempt
        id: deploy_final
        if: steps.deploy_second.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Report publishing status separately
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PUBLISH_STATUS: ${{ job.status }}
        with:
          script: |
            const status = (process.env.PUBLISH_STATUS || 'unknown').toUpperCase();
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## CBB_DASHBOARD_PUBLISH_COMPLETED',
              `**Publishing:** ${status}`,
              `**Workflow URL:** ${url}`,
              `**Run attempt:** ${process.env.GITHUB_RUN_ATTEMPT}`,
              'Scan results were saved in the separate scan job. This is a publishing status, not a new scan.',
              status === 'FAILURE' ? 'Retry only the failed publishing job; no new KenPom or odds scan is needed.' : ''
            ].filter(Boolean).join('\n');
            await core.summary.addRaw(body).write();
            await github.rest.issues.createComment({ ...context.repo, issue_number: 4, body });
