name: Update CBB Tier A dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cbb_tierA_scanner.py'
      - 'dashboard_sync.py'
      - 'cbb_totals_model_v1.b64'
      - 'cbb_totals_model_v1_spec.json'
      - 'cbb_totals_model_v2_challenger.json'
      - 'cbb_totals_model_v3_challenger.json'
      - 'site/**'
      - '.github/workflows/update-dashboard.yml'
  schedule:
    - cron: '15 7 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '30 10,12 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '0 14 * * *'
      timezone: 'America/Los_Angeles'
    # 2026-27 opening-week exception: the season begins with unusually early/overnight games.
    - cron: '17 5 1 11 *'
      timezone: 'America/Los_Angeles'
    - cron: '17 20,23 1 11 *'
      timezone: 'America/Los_Angeles'
    - cron: '17 2,5 2 11 *'
      timezone: 'America/Los_Angeles'

concurrency:
  group: cbb-tier-a-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: read
  pull-requests: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Preflight model and code integrity
        run: |
          python -m py_compile cbb_tierA_scanner.py dashboard_sync.py test_cbb_venue_qc.py test_dashboard_venue_qc.py test_cbb_line_shopping_watchlist.py
          python -m unittest -v test_cbb_venue_qc test_dashboard_venue_qc test_cbb_line_shopping_watchlist
          python - <<'PY'
          import base64, io, json, joblib
          from pathlib import Path
          raw = base64.b64decode(Path("cbb_totals_model_v1.b64").read_text().strip(), validate=True)
          model = joblib.load(io.BytesIO(raw))
          spec = json.loads(Path("cbb_totals_model_v1_spec.json").read_text())
          assert len(spec["features"]) == 78
          assert hasattr(model, "predict")
          v2 = json.loads(Path("cbb_totals_model_v2_challenger.json").read_text())
          assert v2["status"] == "shadow-only prospective challenger"
          assert len(v2["features"]) == 78
          for key in ["imputer_statistics", "scaler_mean", "scaler_scale", "feature_multipliers", "ridge_coef"]:
              assert len(v2[key]) == 78
          assert float(v2["ridge_alpha"]) == 30000
          print("Totals v1 preflight OK:", len(raw), "bytes,", len(spec["features"]), "features")
          print("Totals v2 shadow preflight OK:", len(v2["features"]), "features, alpha", v2["ridge_alpha"])
          v3 = json.loads(Path("cbb_totals_model_v3_challenger.json").read_text())
          assert v3["status"].startswith("experimental shadow-only challenger")
          assert len(v3["features"]) == 78
          for key in ["imputer_statistics", "scaler_mean", "scaler_scale", "feature_multipliers", "ridge_coef"]:
              assert len(v3[key]) == 78
          assert float(v3["ridge_alpha"]) == 30000
          assert v3["priority_order"] == ["3PA rate", "FT%", "turnover rate", "tempo"]
          fam = v3["family_effective_abs_coefficient_sum"]
          assert fam["3PA_rate"] > fam["FT_pct"] > fam["turnover_rate"] > fam["tempo"]
          print("Totals v3 experimental shadow preflight OK:", len(v3["features"]), "features, alpha", v3["ridge_alpha"], "priority", v3["priority_order"])
          PY

      - name: Restore CBBD team-history cache
        uses: actions/cache@v6
        with:
          path: cache
          key: cbb-history-${{ github.run_number }}
          restore-keys: |
            cbb-history-

      - name: Resolve Pacific date
        id: date
        run: |
          pacific_date="$(TZ=America/Los_Angeles date +%F)"
          pacific_hour="$(TZ=America/Los_Angeles date +%H)"
          target="$pacific_date"
          # On Sunday Nov. 1, the U.S. opening marathon starts late Pacific time
          # but is officially part of the Nov. 2 slate. Pre-scan that slate.
          if [ "$pacific_date" = "2026-11-01" ] && [ "$pacific_hour" -ge 20 ]; then
            target="2026-11-02"
          fi
          echo "today=$target" >> "$GITHUB_OUTPUT"

      - name: Run frozen Tier A scanner
        id: scanner
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python cbb_tierA_scanner.py --date "${{ steps.date.outputs.today }}" 2>&1 | tee scanner.log
          if grep -q '^SCAN_STATUS=SKIPPED_KENPOM_ARCHIVE$' scanner.log; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::KenPom same-day archive is not available yet. This scan was cleanly skipped; dashboard state was not changed."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync persistent dashboard state and settle games
        if: steps.scanner.outputs.skipped != 'true'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python dashboard_sync.py "${{ steps.date.outputs.today }}"

      - name: Commit persistent dashboard state
        if: steps.scanner.outputs.skipped != 'true'
        run: |
          git config user.name "cbb-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json site/data/state.json neutral_overrides.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update CBB Tier A dashboard state"
            # The independent NBA feed may update the repository after checkout.
            # Safely integrate its newer commit before publishing CBB state.
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Remote moved during attempt ${attempt}; retrying safely."
              sleep 2
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Unable to publish CBB state without a conflict." >&2
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5

      # Runs even after a scanner/deploy failure; never changes model or output.
      - name: Publish scan-completion signal for ChatGPT Work
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CBB_JOB_STATUS: ${{ job.status }}
          CBB_SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          CBB_SKIPPED: ${{ steps.scanner.outputs.skipped }}
          CBB_TARGET_DATE: ${{ steps.date.outputs.today }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 4; // Dedicated draft PR: automation event feed
            const scanStatus = process.env.CBB_JOB_STATUS || 'unknown';
            const skipped = process.env.CBB_SKIPPED === 'true';
            const result = skipped ? 'SKIPPED_KENPOM_ARCHIVE' :
              scanStatus === 'success' ? 'SUCCESS' :
              scanStatus === 'failure' ? 'FAILURE' : scanStatus.toUpperCase();
            let state = null;
            let readError = '';
            try {
              const response = await github.rest.repos.getContent({
                owner, repo, path: 'site/data/state.json', ref: 'main'
              });
              if (!response.data.content) throw new Error('state.json has no content');
              state = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            } catch (e) { readError = String(e.message || e).slice(0, 180); }
            let sourceRun = {};
            try {
              sourceRun = (await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: context.runId
              })).data;
            } catch (e) { core.warning('Run timing unavailable: ' + String(e.message || e)); }
            const updated = state?.last_updated_pt || 'unavailable';
            const dataMs = Date.parse(updated);
            const startedMs = Date.parse(sourceRun.run_started_at || sourceRun.created_at || '');
            const fresh = result === 'SUCCESS' && state?.status === 'OK' &&
              Number.isFinite(dataMs) && Number.isFinite(startedMs) &&
              dataMs >= startedMs - 3 * 60000 && dataMs <= Date.now() + 60000 &&
              updated.slice(0, 10) === process.env.CBB_TARGET_DATE;
            const dataCheck = fresh ? 'FRESH_COMMITTED_STATE' : 'STALE_OR_UNVERIFIED';
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const lines = [
              '## CBB_SCAN_COMPLETED',
              `**Result:** ${result}`,
              `**Data check:** ${dataCheck}`,
              `**Scanner outcome:** ${process.env.CBB_SCANNER_OUTCOME || 'unknown'}`,
              `**Target date:** ${process.env.CBB_TARGET_DATE || 'unknown'}`,
              `**Workflow URL:** ${runUrl}`,
              `**Workflow run number:** ${context.runNumber}`,
              `**Source trigger:** ${context.eventName}`,
              `**Committed state updated (PT):** ${updated}`,
              `**State status:** ${state?.status || 'unavailable'}`,
              `**Last committed scan date:** ${state?.runs?.at(-1)?.date || 'unavailable'}`,
              readError ? `**Data read error:** ${readError}` : '',
              '',
              '**For ChatGPT Work:** This comment is an event signal, NOT a betting recommendation.',
              'Independently fetch the latest committed state and verify ATS v4 and Totals v1.',
              'Honor KenPom location/venue QC, neutral spreads, current line freshness, tip time,',
              'and frozen qualification thresholds. Exclude stale or already-started plays.',
              'If failed/skipped, report the failure or PASS; never invent prices or bets.',
              '',
              `<!-- cbb-bridge-run-${context.runId} -->`
            ].filter(Boolean);
            try {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: lines.join('\n')
              });
              core.info(`CBB scan ${result}; data ${dataCheck}; notified PR #${issue_number}`);
            } catch (err) {
              const accepted = err.response?.headers?.['x-accepted-github-permissions'] || 'not provided';
              core.error(`CBB_BRIDGE_POST_FAILED: HTTP ${err.status || 'unknown'}; ${err.message}; accepted permissions: ${accepted}`);
              core.error('Inspect Set up job > GITHUB_TOKEN Permissions and Settings > Actions > General > Workflow permissions.');
              throw err;
            }
