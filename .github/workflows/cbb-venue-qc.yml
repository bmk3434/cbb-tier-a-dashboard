name: CBB Venue QC regression

on:
  pull_request:
    paths:
      - 'cbb_tierA_scanner.py'
      - 'test_cbb_venue_qc.py'
      - 'test_cbb_venue_live.py'
      - 'dashboard_sync.py'
      - 'test_dashboard_venue_qc.py'
      - 'venue_qc_exceptions.json'
      - 'site/index.html'
      - '.github/workflows/cbb-venue-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  venue-qc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test venue gating
        run: |
          python -m py_compile cbb_tierA_scanner.py test_cbb_venue_qc.py test_cbb_venue_live.py dashboard_sync.py test_dashboard_venue_qc.py
          python -m unittest -v test_cbb_venue_qc test_dashboard_venue_qc
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          html = Path('site/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', html, re.S)
          assert match, 'dashboard script not found'
          subprocess.run(['node', '--check'], input=match.group(1), text=True, check=True)
          PY
      - name: Check real KenPom FanMatch site classification
        env:
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
        run: python test_cbb_venue_live.py
