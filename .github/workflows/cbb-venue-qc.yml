name: CBB Venue QC regression

on:
  pull_request:
    paths:
      - 'cbb_tierA_scanner.py'
      - 'test_cbb_venue_qc.py'
      - 'test_cbb_venue_live.py'
      - '.github/workflows/cbb-venue-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  venue-qc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test venue gating
        run: |
          python -m py_compile cbb_tierA_scanner.py test_cbb_venue_qc.py test_cbb_venue_live.py
          python -m unittest -v test_cbb_venue_qc
      - name: Check real KenPom FanMatch site classification
        env:
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
        run: python test_cbb_venue_live.py
